  <script>
/* ============================================================
   Tacta — two players overlap shape cards on a shared table.

   Faithful to the 2025 The Op Games card game. Every card is a dark
   rectangle (4 x 6 cells, a 2:3 playing-card shape) with a thick
   coloured frame, one to four printed shapes and a number in the
   middle.

   The only shapes are a SQUARE, two sizes of RECTANGLE and an
   isosceles right TRIANGLE, and each one is anchored to the card:

     S  square      — sits in a corner, two sides on two card edges
     A  long rect   — its long side spans the card's long side
     B  short rect  — its long side equals the card's short side, so it
                      can lie along a long or a short edge
     T  triangle    — isosceles right, hypotenuse on an edge, apex inward

   A card may only be laid down when
     * no shape of it lands on a *different* kind of shape already on
       the table, and
     * at least one shape of it lands on the *same* kind of shape
       already there — which is what "the outlines line up" means.
   A printed shape is opaque, so a shape laid over a dot buries that
   dot. Hands are the full 18-card set each; the player with more of
   their own dots still showing wins.
   ============================================================ */
const Tacta = (() => {
  const BOARD = 36;          // the table is BOARD x BOARD cells
  const W = 4, H = 6;        // cards are W x H cells (a playing-card shape)
  const HAND = 18;           // the full set, dealt to each player
  const START_R = (BOARD - H) / 2, START_C = (BOARD - W) / 2;

  /* The set holds 63 dots a player, and a loose table leaves roughly 50 of them
     showing, so a dot is worth a lot less than it was on the old small board. */
  const PER_DOT = 5;         // points per visible dot
  const WIN_BONUS = 25;
  const MAX_POINTS = 400;

  const BLANK = '.';
  const WILD = '*';          // the base card matches any shape

  /* Card faces. `b` is [row, col, width, height, kind] for every shape, plus a
     6th entry giving a triangle's facing (0 up · 1 right · 2 down · 3 left).
     `d` lists the dot cells as [row, col] pairs.
     kinds: T triangle · S square · A long rectangle · B short rectangle */
  const SPECS = [
    /* --- 1 dot each --- */
    { b: [[0, 0, 4, 2, 'T', 2]], d: [[0, 1]] },                                          /* C1-1 */
    { b: [[0, 0, 2, 2, 'S']], d: [[0, 0]] },                                             /* C1-2 */
    { b: [[0, 0, 2, 6, 'A']], d: [[2, 0]] },                                             /* C1-3 */
    /* --- 2 dots each --- */
    { b: [[0, 0, 4, 2, 'T', 2], [4, 2, 2, 2, 'S']], d: [[0, 1], [4, 2]] },               /* C2-1 */
    { b: [[2, 0, 4, 2, 'B'], [4, 0, 4, 2, 'T', 0]], d: [[2, 1], [5, 1]] },               /* C2-2 */
    { b: [[0, 0, 2, 2, 'S'], [2, 2, 2, 4, 'B']], d: [[0, 0], [2, 2]] },                  /* C2-3 */
    /* --- 3 dots each --- */
    { b: [[0, 0, 4, 2, 'T', 2], [4, 0, 4, 2, 'T', 0]], d: [[0, 0], [0, 3], [5, 1]] },    /* C3-1 */
    { b: [[0, 0, 2, 4, 'T', 1], [4, 0, 2, 2, 'S'], [2, 2, 2, 4, 'B']],
      d: [[1, 0], [4, 0], [2, 2]] },                                                     /* C3-2 */
    { b: [[0, 0, 2, 6, 'A'], [2, 2, 2, 4, 'B']], d: [[1, 0], [4, 0], [2, 2]] },          /* C3-3 */
    /* --- 4 dots each --- */
    { b: [[0, 0, 4, 2, 'T', 2], [2, 2, 2, 4, 'T', 3], [4, 0, 2, 2, 'S']],
      d: [[0, 0], [0, 3], [3, 3], [4, 0]] },                                             /* C4-1 */
    { b: [[0, 0, 2, 2, 'S'], [4, 2, 2, 2, 'S']],
      d: [[0, 0], [1, 1], [4, 2], [5, 3]] },                                             /* C4-2 */
    { b: [[0, 0, 2, 6, 'A'], [0, 2, 2, 2, 'S'], [2, 2, 2, 4, 'B']],
      d: [[1, 0], [4, 0], [0, 2], [2, 2]] },                                             /* C4-3 */
    /* --- 5 dots each --- */
    { b: [[0, 0, 4, 2, 'T', 2], [2, 0, 4, 2, 'B'], [4, 0, 4, 2, 'T', 0]],
      d: [[0, 0], [0, 3], [2, 1], [3, 1], [5, 1]] },                                     /* C5-1 */
    { b: [[0, 0, 4, 2, 'T', 2], [4, 0, 2, 2, 'S'], [4, 2, 2, 2, 'S']],
      d: [[0, 0], [0, 3], [4, 0], [5, 1], [4, 2]] },                                     /* C5-2 */
    { b: [[0, 0, 2, 2, 'S'], [2, 0, 4, 2, 'B'], [4, 0, 4, 2, 'T', 0]],
      d: [[0, 0], [1, 1], [2, 1], [5, 0], [5, 3]] },                                     /* C5-3 */
    /* --- 6 dots each --- */
    { b: [[0, 0, 2, 4, 'T', 1], [2, 2, 2, 4, 'T', 3], [0, 2, 2, 2, 'S'], [4, 0, 2, 2, 'S']],
      d: [[0, 0], [2, 0], [3, 3], [0, 2], [1, 3], [4, 0]] },                             /* C6-1 */
    { b: [[0, 0, 2, 4, 'B'], [0, 2, 2, 4, 'B'], [4, 0, 2, 2, 'S'], [4, 2, 2, 2, 'S']],
      d: [[0, 0], [1, 0], [0, 2], [4, 0], [5, 1], [4, 2]] },                             /* C6-2 */
    { b: [[2, 0, 4, 2, 'T', 2], [2, 0, 4, 2, 'T', 0], [0, 0, 4, 2, 'B'], [4, 0, 4, 2, 'B']],
      d: [[2, 0], [2, 3], [3, 1], [0, 0], [1, 3], [5, 1]] }                              /* C6-3 */
  ];

  const FLIP_FACE = [0, 3, 2, 1];      // mirroring turns a right-facing triangle left

  /* The four corners of a triangle block, in card units. */
  function triVerts(b) {
    const x = b.c, y = b.r, w = b.w, h = b.h;
    const o = b.o || 0;
    if (o === 1) return [[x + w, y + h / 2], [x, y], [x, y + h]];
    if (o === 2) return [[x + w / 2, y + h], [x, y], [x + w, y]];
    if (o === 3) return [[x, y + h / 2], [x + w, y], [x + w, y + h]];
    return [[x + w / 2, y], [x, y + h], [x + w, y + h]];
  }

  /* Is the centre of cell (x, y) of a block inside the shape drawn in it? */
  function inShape(b, x, y) {
    if (b.k !== 'T') return true;                       // squares and rectangles fill their block
    const p = [b.c + x + 0.5, b.r + y + 0.5];
    const t = triVerts(b);
    const cross = (a, c2, d) => (a[0] - d[0]) * (c2[1] - d[1]) - (c2[0] - d[0]) * (a[1] - d[1]);
    const e = [cross(p, t[0], t[1]), cross(p, t[1], t[2]), cross(p, t[2], t[0])];
    return !((e[0] < 0 || e[1] < 0 || e[2] < 0) && (e[0] > 0 || e[1] > 0 || e[2] > 0));
  }

  const areaOf = b => {
    let n = 0;
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) if (inShape(b, x, y)) n++;
    return n;
  };

  /* Turn a card description into a flat W*H face plus its shape blocks. */
  function build(spec) {
    const face = new Array(W * H).fill(BLANK);
    const blocks = spec.b.map(b => {
      const blk = { r: b[0], c: b[1], w: b[2], h: b[3], k: b[4], o: b[5] || 0 };
      for (let y = 0; y < blk.h; y++) {
        for (let x = 0; x < blk.w; x++) {
          if (inShape(blk, x, y)) face[(blk.r + y) * W + blk.c + x] = blk.k;
        }
      }
      return blk;
    });
    return {
      face: face, blocks: blocks,
      dots: spec.d.map(p => p[0] * W + p[1]),
      num: spec.d.length                                 // the card is worth its dots
    };
  }
  const FACES = SPECS.map(build);
  const TOTAL_DOTS = SPECS.reduce((n, s) => n + s.d.length, 0);   // 63

  /* ---------------- geometry ---------------- */

  const orW = rot => ((rot & 1) ? H : W);
  const orH = rot => ((rot & 1) ? W : H);

  /* Where a cell of the card ends up after turning / mirroring it. The result
     is an index into the turned grid, whose width is orW(rot). */
  function mapCell(i, rot, flip) {
    let x = i % W, y = (i / W) | 0;
    let bw = W, bh = H;
    if (flip) x = bw - 1 - x;
    for (let k = 0; k < (rot & 3); k++) {
      const nx = bh - 1 - y, ny = x, nw = bh, nh = bw;
      x = nx; y = ny; bw = nw; bh = nh;
    }
    return y * bw + x;
  }

  /* The same for a shape block, including a triangle's facing. */
  function mapBlock(b, rot, flip) {
    let r = b.r, c = b.c, w = b.w, h = b.h;
    let bw = W, bh = H;
    let o = b.o || 0;
    if (flip) { c = bw - c - w; o = FLIP_FACE[o]; }
    for (let k = 0; k < (rot & 3); k++) {
      const nr = c, nc = bh - r - h, nw = h, nh = w;
      r = nr; c = nc; w = nw; h = nh;
      o = (o + 1) & 3;
      const t = bw; bw = bh; bh = t;
    }
    return { r: r, c: c, w: w, h: h, k: b.k, o: o };
  }

  function shuffled(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------- setup ---------------- */

  /* Both players get the whole 18 card set — only the colour differs. */
  function start() {
    const cards = [];
    const hands = [[], []];
    for (let p = 0; p < 2; p++) {
      FACES.forEach(spec => {
        const id = cards.length;
        cards.push({
          id: id, owner: p, face: spec.face, blocks: spec.blocks,
          dots: spec.dots, num: spec.num,
          rot: 0, flip: 0, placed: false, r: -1, c: -1
        });
        hands[p].push(id);
      });
    }
    return {
      board: BOARD, w: W, h: H, startR: START_R, startC: START_C,
      cards: cards, hands: hands, stack: [],
      turn: 0, moves: 0, passes: 0,
      status: 'playing', winner: -1, reason: '', visible: [0, 0],
      startedAt: Date.now(), elapsedMs: 0
    };
  }

  const cardOf = (st, id) => st.cards[id] || null;
  const handOf = (st, owner) => st.hands[owner] || [];
  const placedCount = (st, owner) => st.cards.filter(c => c.placed && c.owner === owner).length;

  const faceOf = card => {
    const out = new Array(W * H);
    for (let i = 0; i < out.length; i++) out[mapCell(i, card.rot, card.flip)] = card.face[i];
    return out;
  };
  const blocksOf = card => card.blocks.map(b => mapBlock(b, card.rot, card.flip));
  const dotsOf = card => card.dots.map(i => mapCell(i, card.rot, card.flip));

  function orientFace(card, rot, flip) {
    const out = new Array(W * H);
    for (let i = 0; i < out.length; i++) out[mapCell(i, rot, flip)] = card.face[i];
    return out;
  }

  function rotate(st, id) {
    const c = cardOf(st, id);
    if (c && !c.placed) c.rot = (c.rot + 1) & 3;
    return st;
  }

  function flip(st, id) {
    const c = cardOf(st, id);
    if (c && !c.placed) c.flip = c.flip ? 0 : 1;
    return st;
  }

  /* ---------------- reading the table ---------------- */

  /* Walks the pile from the top down.
     `top[i]` = the shape printed highest on cell i — what a new card would
     land on. `dot[i]` = the highest dot on cell i that no shape has been laid
     over, i.e. the dots you can still see. */
  function view(st) {
    const n = BOARD * BOARD;
    const top = new Array(n).fill(null);
    const dot = new Array(n).fill(null);
    for (let k = st.stack.length - 1; k >= 0; k--) {
      const card = st.cards[st.stack[k]];
      const face = faceOf(card);
      const dots = dotsOf(card);
      const ow = orW(card.rot);
      for (let t = 0; t < dots.length; t++) {
        const di = dots[t];
        const i = (card.r + ((di / ow) | 0)) * BOARD + card.c + (di % ow);
        if (!top[i] && !dot[i]) dot[i] = { owner: card.owner, card: card.id };
      }
      for (let y = 0; y < face.length; y++) {
        const ch = face[y];
        if (ch === BLANK) continue;
        const i = (card.r + ((y / ow) | 0)) * BOARD + card.c + (y % ow);
        if (!top[i]) top[i] = { kind: ch, owner: card.owner, card: card.id };
      }
    }
    /* The base card sits under everything: it carries every shape in every
       position, so it matches anything. Filling it in last matters — done first
       it would mask the real shapes laid on top of it and bury dots that are
       still perfectly visible. */
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (START_R + y) * BOARD + START_C + x;
        if (!top[i]) top[i] = { kind: WILD, owner: -1, card: -1 };
      }
    }
    return { top: top, dot: dot };
  }

  /* Which shape of the card each cell of the turned card belongs to. */
  function blockMap(blocks, ow) {
    const m = new Array(W * H).fill(-1);
    blocks.forEach((b, k) => {
      for (let y = 0; y < b.h; y++) {
        for (let x = 0; x < b.w; x++) {
          const i = (b.r + y) * ow + b.c + x;
          if (i >= 0 && i < m.length && m[i] === -1) m[i] = k;
        }
      }
    });
    return m;
  }

  /* How a face laid at (r, c) would land on the table. `map` is optional and
     only used to count how many separate shapes lined up. */
  function scan(top, face, r, c, ow, map) {
    let ink = 0, overlap = 0, clash = false;
    const hits = map ? new Set() : null;
    for (let y = 0; y < face.length; y++) {
      const ch = face[y];
      if (ch === BLANK) continue;
      ink++;
      const t = top[(r + ((y / ow) | 0)) * BOARD + c + (y % ow)];
      if (!t) continue;
      if (t.kind === WILD || t.kind === ch) { overlap++; if (hits) hits.add(map[y]); }
      else clash = true;
    }
    return { ink: ink, overlap: overlap, shapes: hits ? hits.size : 0, clash: clash };
  }

  const inside = (r, c, rot) =>
    r >= 0 && c >= 0 && r + orH(rot) <= BOARD && c + orW(rot) <= BOARD;

  function canPlace(st, id, r, c) {
    const card = cardOf(st, id);
    if (!card || card.placed) return { ok: false, reason: 'gone' };
    if (st.status !== 'playing') return { ok: false, reason: 'over' };
    if (!inside(r, c, card.rot)) return { ok: false, reason: 'off' };
    const face = faceOf(card);
    const s = scan(view(st).top, face, r, c, orW(card.rot), blockMap(blocksOf(card), orW(card.rot)));
    if (s.clash) return { ok: false, reason: 'clash' };
    if (s.overlap === 0) return { ok: false, reason: 'lonely' };
    return { ok: true, face: face, r: r, c: c, overlap: s.overlap, shapes: s.shapes };
  }

  function place(st, id, r, c) {
    const card = cardOf(st, id);
    if (!card || card.placed) return st;
    card.placed = true;
    card.r = r;
    card.c = c;
    st.stack.push(id);
    const hand = st.hands[card.owner];
    const at = hand.indexOf(id);
    if (at >= 0) hand.splice(at, 1);
    st.moves++;
    st.passes = 0;
    endTurn(st, card.owner);
    return st;
  }

  function endTurn(st, mover) {
    if (!st.hands[0].length && !st.hands[1].length) { settle(st, 'all'); return st; }
    st.turn = 1 - mover;
    return st;
  }

  /* Nobody can lay anything down: two passes in a row close the game. */
  function pass(st) {
    if (st.status !== 'playing') return st;
    st.passes++;
    if (st.passes >= 2) { settle(st, 'stuck'); return st; }
    st.turn = 1 - st.turn;
    return st;
  }

  /* ---------------- scoring ---------------- */

  function tally(st) {
    const v = view(st);
    const total = [0, 0];
    st.cards.forEach(card => {
      if (!card.placed) return;
      total[card.owner] += card.dots.length;
    });
    const visible = [0, 0];
    v.dot.forEach(d => { if (d) visible[d.owner]++; });
    return {
      visible: visible, total: total,
      hidden: [total[0] - visible[0], total[1] - visible[1]],
      view: v
    };
  }

  function scoreWith(st, owner, t) {
    const bonus = st.winner === owner ? WIN_BONUS : 0;
    return {
      points: Math.max(0, Math.min(MAX_POINTS, Math.round(t.visible[owner] * PER_DOT) + bonus)),
      bonus: bonus,
      visible: t.visible[owner], total: t.total[owner], hidden: t.hidden[owner],
      placed: placedCount(st, owner), left: handOf(st, owner).length
    };
  }

  function settle(st, reason) {
    const t = tally(st);
    st.visible = t.visible;
    st.status = t.visible[0] === t.visible[1] ? 'draw' : 'done';
    st.winner = t.visible[0] === t.visible[1] ? -1 : (t.visible[0] > t.visible[1] ? 0 : 1);
    st.reason = reason;
    return st;
  }

  function score(st) {
    if (st.status === 'playing') settle(st, 'all');
    const t = tally(st);
    return { 0: scoreWith(st, 0, t), 1: scoreWith(st, 1, t), tally: t };
  }

  function end(st) {
    if (st.status === 'playing') settle(st, 'all');
    return st;
  }

  function finish(st) {
    if (st.status === 'playing') settle(st, 'all');
    const t = tally(st);
    return {
      status: st.status, winner: st.winner, reason: st.reason,
      seconds: Math.round((st.elapsedMs || 0) / 1000),
      moves: st.moves, board: BOARD, w: W, h: H,
      dots: [
        { visible: t.visible[0], total: t.total[0], hidden: t.hidden[0] },
        { visible: t.visible[1], total: t.total[1], hidden: t.hidden[1] }
      ],
      covered: t.hidden[0] + t.hidden[1],
      perDot: PER_DOT, winBonus: WIN_BONUS,
      scores: { 0: scoreWith(st, 0, t), 1: scoreWith(st, 1, t) }
    };
  }

  /* ---------------- move search ---------------- */

  /* A card may be turned any way, so every orientation is tried. */
  function hasAnyMove(st, owner) {
    const top = view(st).top;
    const hand = st.hands[owner] || [];
    for (let k = 0; k < hand.length; k++) {
      const card = st.cards[hand[k]];
      for (let flip = 0; flip < 2; flip++) {
        for (let rot = 0; rot < 4; rot++) {
          if (spotsFor(top, orientFace(card, rot, flip), rot)) return true;
        }
      }
    }
    return false;
  }

  function spotsFor(top, face, rot) {
    const ow = orW(rot), oh = orH(rot);
    for (let r = 0; r + oh <= BOARD; r++) {
      for (let c = 0; c + ow <= BOARD; c++) {
        const s = scan(top, face, r, c, ow);
        if (!s.clash && s.overlap > 0) return true;
      }
    }
    return false;
  }

  /* Every shape position the set uses, for drawing the base card. */
  const BASE_POSITIONS = (() => {
    const seen = new Set();
    const out = [];
    SPECS.forEach(s => s.b.forEach(b => {
      const key = b.join(',');
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ r: b[0], c: b[1], w: b[2], h: b[3], k: b[4], o: b[5] || 0 });
    }));
    return out;
  })();

  return {
    BOARD: BOARD, W: W, H: H, HAND: HAND,
    START_R: START_R, START_C: START_C,
    TOTAL_DOTS: TOTAL_DOTS,
    PER_DOT: PER_DOT, WIN_BONUS: WIN_BONUS, MAX_POINTS: MAX_POINTS,
    BLANK: BLANK, WILD: WILD,
    BASE_POSITIONS: BASE_POSITIONS, SPECS: SPECS,
    orW: orW, orH: orH, triVerts: triVerts, areaOf: areaOf,
    start: start, cardOf: cardOf, handOf: handOf, placedCount: placedCount,
    faceOf: faceOf, blocksOf: blocksOf, dotsOf: dotsOf,
    mapCell: mapCell, mapBlock: mapBlock, blockMap: blockMap,
    rotate: rotate, flip: flip,
    view: view, scan: scan, canPlace: canPlace, place: place, pass: pass,
    endTurn: endTurn, hasAnyMove: hasAnyMove, tally: tally, score: score,
    end: end, finish: finish
  };
})();

  <script>
/* ============================================================
   WordBubbles — local persistence (players, scores, theme)
   ============================================================ */
const Store = (() => {
  const KEY = 'wordbubbles.v1';
  let state = null;

  function defaults() {
    return { players: [], currentPlayerId: null, theme: 'light', version: 1 };
  }

  function load() {
    try {
      state = JSON.parse(localStorage.getItem(KEY)) || null;
    } catch (e) {
      state = null;
    }
    if (!state || typeof state !== 'object') state = defaults();
    if (!Array.isArray(state.players)) state.players = [];
    if (!state.theme) state.theme = 'light';
    // migrate older saves so every player has the newer fields
    state.players.forEach(p => {
      if (typeof p.score !== 'number') p.score = 0;
      if (typeof p.best !== 'number') p.best = 0;
      if (typeof p.games !== 'number') p.games = 0;
      if (typeof p.perfect !== 'number') p.perfect = 0;
      if (typeof p.totalMs !== 'number') p.totalMs = 0;
      if (!Array.isArray(p.history)) p.history = [];
      p.history.forEach(e => { if (!e.mode) e.mode = 'words'; });
    });
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) { /* storage may be unavailable */ }
  }

  function uid() {
    return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  const api = {
    init() { load(); return state; },
    get state() { return state; },
    save,

    getPlayers() { return state.players; },
    getPlayer(id) { return state.players.find(p => p.id === id) || null; },
    getCurrent() { return api.getPlayer(state.currentPlayerId); },

    addPlayer(name, avatar) {
      const player = {
        id: uid(),
        name: (name || 'Player').trim(),
        avatar: avatar || AVATARS[0].id,
        score: 0,
        best: 0,
        games: 0,
        perfect: 0,
        totalMs: 0,
        history: [],
        createdAt: Date.now()
      };
      state.players.push(player);
      state.currentPlayerId = player.id;
      save();
      return player;
    },

    deletePlayer(id) {
      state.players = state.players.filter(p => p.id !== id);
      if (state.currentPlayerId === id) state.currentPlayerId = null;
      save();
    },

    selectPlayer(id) {
      if (api.getPlayer(id)) { state.currentPlayerId = id; save(); }
    },

    /** Record a finished game for a player and return the updated player. */
    recordGame(id, rec) {
      const p = api.getPlayer(id);
      if (!p) return null;
      const points = rec.points || 0;
      p.score = (p.score || 0) + points;
      p.games = (p.games || 0) + 1;
      p.best = Math.max(p.best || 0, points);
      if (rec.perfect) p.perfect = (p.perfect || 0) + 1;
      p.totalMs = (p.totalMs || 0) + Math.max(0, Math.round((rec.seconds || 0) * 1000));
      p.history = p.history || [];
      p.history.unshift({
        at: Date.now(),
        mode: rec.mode || 'words',
        difficulty: rec.difficulty || 'easy',
        points: points,
        seconds: rec.seconds || 0,
        /* word-fill rounds */
        passage: rec.passage || '',
        correct: rec.correct || 0,
        total: rec.total || 0,
        speed: rec.speed || 1,
        mindUsed: rec.mindUsed || 0,
        perfect: !!rec.perfect,
        /* math duels */
        opponent: rec.opponent || '',
        myScore: typeof rec.myScore === 'number' ? rec.myScore : 0,
        oppScore: typeof rec.oppScore === 'number' ? rec.oppScore : 0,
        outcome: rec.outcome || ''
      });
      if (p.history.length > 100) p.history.length = 100;
      save();
      return p;
    },

    setTheme(theme) { state.theme = theme; save(); }
  };

  return api;
})();

  <script>
/* ============================================================
   WordBubbles — game engine (tokenising, blanking, scoring,
   Super Mind hint generation)
   ============================================================ */
const Game = (() => {

  /* Words we never blank out — too easy / no meaning to guess. */
  const STOPWORDS = new Set((
    'the and for his her you she are but not with they this that from have has had were will would ' +
    'there their what when then them than its our out who why how all any can may into over just ' +
    'your been some very much many more most only also such too did does done doing being each other ' +
    'after before again once here where while both few own same now about above below under between ' +
    'during against because until upon onto off away back down further then once am is was be to of ' +
    'in on at by as it he we us my me i do so if or no up'
  ).split(/\s+/).filter(Boolean));

  /* ---------- word bank, grouped by length (lazy) ---------- */
  let bankByLen = null;
  function bank(n) {
    if (!bankByLen) {
      bankByLen = {};
      WORDBANK.forEach(w => {
        const k = w.length;
        (bankByLen[k] = bankByLen[k] || []).push(w);
      });
    }
    return bankByLen[n] || [];
  }

  /* ---------- helpers ---------- */
  function tokenize(text) { return text.match(/[A-Za-z]+|\s+|[^A-Za-z\s]+/g) || []; }
  function isWord(tok) { return /^[A-Za-z]+$/.test(tok); }
  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }
  /* Small deterministic RNG (mulberry32) so a blank always looks the same. */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- passage & blank selection ---------- */
  function poolFor(difficulty) {
    if (typeof PASSAGE_POOLS !== 'undefined' && PASSAGE_POOLS[difficulty]) return PASSAGE_POOLS[difficulty];
    return typeof PASSAGES !== 'undefined' ? PASSAGES : [];
  }

  function pickPassage(difficulty, excludeId) {
    const pool = poolFor(difficulty);
    let list = pool;
    if (pool.length > 1 && excludeId) {
      const rest = pool.filter(p => p.id !== excludeId);
      if (rest.length) list = rest;
    }
    return list[Math.floor(Math.random() * list.length)];
  }

  /* A word that is capitalised somewhere in the middle of a sentence is a
     proper noun. Remember all of them so a name at the START of a sentence
     is never blanked either (otherwise "Tom has a red ball" could hide Tom). */
  let properNouns = null;
  function getProperNouns() {
    if (properNouns) return properNouns;
    properNouns = new Set();
    poolFor('primary').concat(poolFor('easy'), poolFor('medium'), poolFor('hard')).forEach(p => {
      let start = true;
      tokenize(p.text).forEach(tok => {
        if (/^\s+$/.test(tok)) return;
        if (isWord(tok)) {
          if (/^[A-Z]/.test(tok) && !start) properNouns.add(tok.toLowerCase());
          start = false;
        } else if (/[.!?]/.test(tok)) {
          start = true;
        }
      });
    });
    /* Names that only ever appear at the start of a sentence cannot be
       detected above, so list them explicitly. */
    ['tom', 'sara', 'amelia', 'daniel', 'lily', 'max', 'ben', 'anna', 'peter',
      'chen', 'patel', 'ali', 'lee', 'snow', 'lucky', 'elias', 'maria', 'david',
      'mimi', 'leo', 'mara', 'mrs', 'mr', 'miss'].forEach(n => properNouns.add(n));
    return properNouns;
  }

  function eligibleIndices(tokens, minLen) {
    const names = getProperNouns();
    const out = [];
    let sentenceStart = true;
    for (let i = 0; i < tokens.length; i++) {
      const tok = tokens[i];
      if (/^\s+$/.test(tok)) continue;
      if (isWord(tok)) {
        const lower = tok.toLowerCase();
        const proper = names.has(lower) || (/^[A-Z]/.test(tok) && !sentenceStart);
        if (tok.length >= minLen && !STOPWORDS.has(lower) && !proper) out.push(i);
        sentenceStart = false;
      } else if (/[.!?]/.test(tok)) {
        sentenceStart = true;
      }
    }
    return out;
  }

  function chooseBlanks(tokens, difficulty, seedStr) {
    const cfg = DIFFICULTY[difficulty] || DIFFICULTY.easy;
    const elig = eligibleIndices(tokens, cfg.minLen);
    const blanks = new Set();
    if (!elig.length) return blanks;
    const offset = hash(seedStr) % cfg.step;
    for (let k = offset; k < elig.length; k += cfg.step) blanks.add(elig[k]);
    return blanks;
  }

  function estimateBlanks(passage, difficulty) {
    return chooseBlanks(tokenize(passage.text), difficulty, passage.id).size;
  }

  /* Average blanks across a whole difficulty pool — used by the UI. */
  function averageBlanks(difficulty) {
    const pool = poolFor(difficulty);
    if (!pool.length) return 0;
    const counts = pool.map(p => chooseBlanks(tokenize(p.text), difficulty, p.id).size);
    return Math.round(counts.reduce((a, b) => a + b, 0) / counts.length);
  }

  /* ---------- Super Mind ---------- */
  const passageWords = {};
  function collectPassageWords() {
    PASSAGES.forEach(p => {
      tokenize(p.text).forEach(tok => {
        if (isWord(tok)) (passageWords[tok.length] = passageWords[tok.length] || []).push(tok.toLowerCase());
      });
    });
  }

  function optionPool(word) {
    if (!Object.keys(passageWords).length) collectPassageWords();
    const n = word.length;
    const set = new Set();
    const add = w => {
      const lw = w.toLowerCase();
      if (lw.length === n && !STOPWORDS.has(lw)) set.add(lw);
    };
    bank(n).forEach(add);
    (passageWords[n] || []).forEach(add);
    set.delete(word.toLowerCase());
    return [...set];
  }

  /* Five words of the same length — four distractors plus the answer.
     Cached per blank so focusing the same gap again shows the same list. */
  function optionsFor(round, index) {
    if (!round.mind) round.mind = {};
    if (round.mind[index]) return round.mind[index];

    const word = round.tokens[index];
    const rand = rng(hash(round.passage.id + '|' + index + '|' + word.toLowerCase()));
    const copy = optionPool(word);
    const used = new Set([word.toLowerCase()]);
    const picked = [];
    let guard = 0;
    while (picked.length < 4 && copy.length && guard++ < 800) {
      const j = Math.floor(rand() * copy.length);
      const cand = copy.splice(j, 1)[0];
      if (used.has(cand)) continue;
      used.add(cand);
      picked.push(cand);
    }

    const opts = [word.toLowerCase(), ...picked];
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
    }
    round.mind[index] = opts;
    return opts;
  }

  /* ---------- lifecycle ---------- */
  function start(difficulty, excludeId) {
    const passage = pickPassage(difficulty, excludeId);
    const tokens = tokenize(passage.text);
    const blanks = chooseBlanks(tokens, difficulty, passage.id);
    return {
      passage,
      difficulty,
      tokens,
      blanks,
      answers: {},                 // token index -> typed string
      mind: {},                    // token index -> cached option list
      mindShown: new Set(),        // blanks already revealed this round
      mindCharges: Math.floor(blanks.size / 2),   // half the gaps, rounded down
      mindUsed: 0,
      startedAt: Date.now(),
      finishedAt: null,
      elapsedMs: 0
    };
  }

  /* Seconds of reading/typing allowed per blank before the speed bonus drops. */
  const SEC_PER_BLANK = 12;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /* Par time for a round — the UI shows it next to the clock. */
  function parSeconds(total) { return Math.max(1, total * SEC_PER_BLANK); }

  function grade(round) {
    const cfg = DIFFICULTY[round.difficulty] || DIFFICULTY.easy;
    const details = [];
    let correct = 0, base = 0, letters = 0;

    [...round.blanks].sort((a, b) => a - b).forEach(i => {
      const word = round.tokens[i];
      const given = (round.answers[i] || '').trim();
      const ok = given.toLowerCase() === word.toLowerCase();
      if (ok) {
        correct++;
        letters += word.length;
        base += Math.round(word.length * 10 * cfg.mult);
      }
      details.push({ index: i, word, given, ok });
    });

    const total = round.blanks.size;
    const perfect = total > 0 && correct === total;
    const seconds = round.elapsedMs
      ? Math.round(round.elapsedMs / 1000)
      : Math.round(((round.finishedAt || Date.now()) - round.startedAt) / 1000);

    /* Time factor: beating par multiplies the score up to 1.8x,
       running slow pulls it down to 0.6x. */
    const par = parSeconds(total);
    const speed = clamp(par / Math.max(seconds, 1), 0.6, 1.8);
    const multiplier = Math.round(base * speed);
    const timeBonus = multiplier - base;
    const perfectBonus = perfect ? 100 : 0;
    const points = multiplier + perfectBonus;

    return {
      total, correct, points, base, letters, perfect,
      accuracy: total ? Math.round((correct / total) * 100) : 0,
      seconds, par, speed, timeBonus, perfectBonus, details
    };
  }

  return { tokenize, isWord, chooseBlanks, estimateBlanks, averageBlanks, poolFor, parSeconds, optionsFor, start, grade };
})();

  <script>
/* ============================================================
   WordBubbles — view layer (renders HTML, no game state)
   ============================================================ */
const UI = (() => {
  const app = () => document.getElementById('app');

  /* every mode that needs two players picked on the home screen */
  const DUELS = ['math', 'chess', 'gomoku', 'go', 'wordstack', 'tacta'];

  /* labels used by the history list */
  const HIST_MODES = {
    math: { name: 'Math Duel', score: 'opp ' },
    chess: { name: 'Chess', score: 'material ' },
    gomoku: { name: 'Gomoku', score: 'stones ' },
    go: { name: 'Go', score: 'area ' },
    wordstack: { name: 'Word Stack', score: 'words ' },
    tacta: { name: 'Tacta', score: 'dots ' },
    slide: { name: 'Number Slide', score: 'moves ' },
    sudoku: { name: 'Sudoku', score: 'cells ' }
  };

  /* solo games that are filed by difficulty rather than by opponent */
  const SOLO_PUZZLES = ['slide', 'sudoku'];

  /* Every game, in one place so a new one only has to be described once. */
  const MODES = {
    words: { title: 'Word Fill', tag: '1 player',
      desc: 'Fill the gaps in a short English passage.' },
    wordstack: { title: 'Word Stack', tag: '2 players',
      desc: 'Two players, overlap your word tiles letter by letter.' },
    math: { title: 'Math Duel', tag: '2 players',
      desc: 'Two players, cards and numbers, turn by turn.' },
    mine: { title: 'Minesweeper', tag: '1 player',
      desc: 'Solo, clear the grid without setting off a mine.' },
    slide: { title: 'Number Slide', tag: '1 player',
      desc: 'Solo, slide the numbers back into order in the frame.' },
    sudoku: { title: 'Sudoku', tag: '1 player',
      desc: 'Solo, fill the grid so every row, column and box holds 1-9.' },
    chess: { title: 'Chess', tag: '2 players',
      desc: 'Two players, a real board, turning each move.' },
    gomoku: { title: 'Gomoku', tag: '2 players',
      desc: 'Two players, black first, five in a row on a line grid.' },
    go: { title: 'Go', tag: '2 players',
      desc: 'Two players, surround territory, capture and keep it.' },
    tacta: { title: 'Tacta', tag: '2 players',
      desc: 'Two players, rotate and overlap shape cards, cover opponent scoring dots and protect your own.' }
  };

  /* The home screen lists the games in these groups. `tacta` is finished and
     kept working but pulled off the menu for now — put it back in the Board
     strategy list to unhide it. */
  const MODE_GROUPS = [
    { name: 'Words', note: 'Reading, spelling and letter tiles.',
      modes: ['words', 'wordstack'] },
    { name: 'Numbers & logic', note: 'Arithmetic, deduction and puzzles.',
      modes: ['math', 'mine', 'slide', 'sudoku'] },
    { name: 'Board strategy', note: 'Two players fighting over a shared board.',
      modes: ['chess', 'gomoku', 'go'] }
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function fmtDuration(ms) {
    const s = Math.max(0, Math.round((ms || 0) / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    if (h) return h + 'h ' + m + 'm';
    if (m) return m + 'm ' + (s % 60) + 's';
    return s + 's';
  }

  function shortDate(ts) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleString(undefined,
        { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  /* ---------------- home ---------------- */
  function playerCard(p, selected, i) {
    const games = p.games || 0;
    const score = p.score || 0;
    const line1 = games
      ? 'best ' + (p.best || 0) + ' · ' + games + (games === 1 ? ' game' : ' games')
      : 'No games yet';
    return '<div class="player-card ' + (selected ? 'selected' : '') + '" data-player="' + p.id + '" ' +
      'style="--i:' + i + '">' +
      '<button class="player-del" data-del="' + p.id + '" title="Remove player" aria-label="Remove player">×</button>' +
      '<div class="player-avatar">' + avatarSvg(p.avatar) + '</div>' +
      '<div class="player-name">' + esc(p.name) + '</div>' +
      '<div class="player-score' + (score < 0 ? ' neg' : '') + '">' +
        score.toLocaleString() + ' pts</div>' +
      '<div class="player-meta">' + esc(line1) + '</div>' +
      '<div class="player-meta">played ' + esc(fmtDuration(p.totalMs || 0)) + '</div>' +
      (games ? '<button class="player-history" data-history="' + p.id + '">History</button>' : '') +
      '</div>';
  }

  function modeCard(key, title, desc, tag, selected) {
    return '<button class="mode-card ' + (selected ? 'selected' : '') + '" data-mode="' + key + '">' +
      '<div class="mode-title">' + esc(title) + '</div>' +
      '<div class="mode-desc">' + esc(desc) + '</div>' +
      '<div class="mode-tag">' + esc(tag) + '</div>' +
      '</button>';
  }

  function homeLabel(mode) {
    return {
      chess: 'Start match', gomoku: 'Start match', go: 'Start game', mine: 'Start game',
      wordstack: 'Start match', tacta: 'Start match', slide: 'Start game', sudoku: 'Start game'
    }[mode] || (mode === 'math' ? 'Start duel' : 'Continue');
  }

  /* Home button every in-game screen carries, so leaving a game never needs the
     logo. It never touches scores — they are only written when a game ends. */
  const HOME_BTN = '<button class="btn ghost home-btn" id="homeBtn" ' +
    'title="Back to home — your score stays as it is">Home</button>';

  function home(players, selectedIds, mode) {
    const duel = DUELS.indexOf(mode) >= 0;
    const sel = selectedIds || [];
    const cards = players.map((p, i) => playerCard(p, sel.indexOf(p.id) >= 0, i)).join('');
    const ready = players.length ? (duel ? sel.length === 2 : sel.length === 1) : false;
    const hint = players.length
      ? (duel
        ? 'Pick 2 players — ' + sel.length + '/2 selected.'
        : 'Pick 1 player.')
      : '';
    const label = homeLabel(mode);

    app().innerHTML =
      '<div class="screen">' +
        '<h1 class="page-title">WordBubbles</h1>' +
        '<p class="page-sub">Nine minimal games, grouped by what they ask of you: fill in an ' +
          'English passage or stack word tiles, duel with cards or clear a minefield, ' +
          'work a puzzle, or settle it over a board of chess or stones.</p>' +
        '<div class="section-label">Game mode</div>' +
        '<div class="mode-groups">' +
          MODE_GROUPS.map(g =>
            '<section class="mode-group">' +
              '<div class="mode-group-head">' +
                '<span class="mode-group-name">' + esc(g.name) + '</span>' +
                '<span class="mode-group-note">' + esc(g.note) + '</span>' +
                '<span class="mode-group-count">' + g.modes.length + '</span>' +
              '</div>' +
              '<div class="modes">' +
                g.modes.map(k => modeCard(k, MODES[k].title, MODES[k].desc, MODES[k].tag, mode === k)).join('') +
              '</div>' +
            '</section>').join('') +
        '</div>' +
        '<div class="section-label">Who is playing?</div>' +
        (hint ? '<p class="select-hint">' + esc(hint) + '</p>' : '') +
        '<div class="players">' +
          (cards || '') +
          '<button class="player-add" id="addPlayer" style="--i:' + players.length + '">' +
            '<span class="plus">+</span><span>Add player</span></button>' +
        '</div>' +
        (players.length ? '' :
          '<div class="empty" style="margin-top:16px">No players yet. Add one to begin.</div>') +
        '<div class="actions">' +
          '<button class="btn primary big" id="continueBtn"' + (ready ? '' : ' disabled') + '>' + label + '</button>' +
        '</div>' +
      '</div>';
  }

  /* Light-touch update for the home screen. Picking a player or a mode must
     only flip the selection — rebuilding the page made it flash every time. */
  function homeUpdate(players, selectedIds, mode) {
    const duel = DUELS.indexOf(mode) >= 0;
    const sel = selectedIds || [];
    document.querySelectorAll('[data-mode]').forEach(b => {
      b.classList.toggle('selected', b.dataset.mode === mode);
    });
    document.querySelectorAll('.player-card').forEach(c => {
      c.classList.toggle('selected', sel.indexOf(c.dataset.player) >= 0);
    });
    const hint = document.querySelector('.select-hint');
    if (hint) hint.textContent = players.length
      ? (duel ? 'Pick 2 players — ' + sel.length + '/2 selected.' : 'Pick 1 player.')
      : '';
    const btn = document.getElementById('continueBtn');
    if (btn) {
      btn.disabled = !(players.length && (duel ? sel.length === 2 : sel.length === 1));
      btn.textContent = homeLabel(mode);
    }
  }

  /* ---------------- difficulty ---------------- */
  function difficulty(selected) {
    const order = ['primary', 'easy', 'medium', 'hard'];
    const level = { primary: 1, easy: 2, medium: 3, hard: 4 };
    const cards = order.map((d, i) => {
      const cfg = DIFFICULTY[d];
      const n = Game.averageBlanks(d);
      let dots = '';
      for (let k = 1; k <= 4; k++) dots += '<i class="' + (k <= level[d] ? 'on' : '') + '"></i>';
      return '<button class="diff-card ' + (selected === d ? 'selected' : '') + '" data-diff="' + d + '" ' +
        'style="--i:' + i + '">' +
        '<div class="diff-name">' + cfg.label + '</div>' +
        '<div class="diff-desc">' + esc(cfg.desc) + '</div>' +
        '<div class="diff-dots">' + dots + '</div>' +
        '<div class="diff-stat">≈ ' + n + ' blanks · ' + cfg.mult + '× points</div>' +
        '</button>';
    }).join('');

    app().innerHTML =
      '<div class="screen">' +
        '<h1 class="page-title">Choose difficulty</h1>' +
        '<p class="page-sub">Longer words and denser gaps mean higher scores. Every round you get ' +
          'half as many Super Mind hints as there are gaps.</p>' +
        '<div class="diffs">' + cards + '</div>' +
        '<div class="actions">' +
          '<button class="btn ghost" id="backHome">Back</button>' +
          '<button class="btn primary" id="startBtn"' + (selected ? '' : ' disabled') + '>Start game</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- passage rendering ---------------- */
  function renderPlayPassage(round) {
    return round.tokens.map((tok, i) => {
      if (round.blanks.has(i)) {
        const n = tok.length;
        const pos = (typeof posOf === 'function') ? posOf(tok) : null;
        // number sits inside the box; the part of speech floats above it
        return '<span class="blank">' +
          (pos ? '<span class="pos">' + esc(pos) + '</span>' : '') +
          '<span class="num">' + n + '</span>' +
          '<input class="bin" data-i="' + i + '" type="text" maxlength="' + n + '" ' +
          'autocomplete="off" autocapitalize="off" spellcheck="false" ' +
          'style="width:calc(' + n + 'ch + 0.25em)">' +
          '</span>';
      }
      return esc(tok);
    }).join('');
  }

  function renderResultPassage(round, details) {
    const map = {};
    details.forEach(d => { map[d.index] = d; });
    let k = 0;
    return round.tokens.map((tok, i) => {
      if (round.blanks.has(i)) {
        const d = map[i];
        const delay = 'style="animation-delay:' + (k * 30) + 'ms"';
        k++;
        if (d && d.ok) return '<span class="rword ok" ' + delay + '>' + esc(tok) + '</span>';
        const given = d && d.given
          ? '<span class="rword bad" ' + delay + '>' + esc(d.given) + '</span> ' : '';
        return given + '<span class="rword fix"' + (given ? '' : ' ' + delay) + '>' + esc(tok) + '</span>';
      }
      return esc(tok);
    }).join('');
  }

  /* ---------------- game ---------------- */
  function game(round, player) {
    const cfg = DIFFICULTY[round.difficulty];
    const noCharges = round.mindCharges === 0;
    app().innerHTML =
      '<div class="screen">' +
        '<div class="game-head">' +
          '<span class="chip" style="--i:0">Player <strong>' + esc(player.name) + '</strong></span>' +
          '<span class="chip" style="--i:1">' + cfg.label + ' · <strong>' + round.blanks.size + '</strong> gaps</span>' +
          '<span class="chip" style="--i:2">Time <strong id="timer">0:00</strong>' +
            '<span class="par">/ ' + fmtTime(Game.parSeconds(round.blanks.size)) + '</span></span>' +
          '<button class="chip mind-btn' + (noCharges ? ' is-empty' : '') + '" id="mindBtn"' +
            (noCharges ? ' disabled' : '') + ' style="--i:3" ' +
            'title="Turn on Super Mind, then click a gap">' +
            '<span class="dot"></span>Super Mind <strong id="mindCount">' +

  /* ---------------- goban (shared by Gomoku and Go) ---------------- */

  const STARS = {
    9: [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]],
    13: [[3, 3], [3, 9], [9, 3], [9, 9], [6, 6]],
    15: [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]],
    19: [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]]
  };

  const pct = (k, n) => ((k / (n - 1)) * 100).toFixed(4) + '%';

  /* A line grid you drop stones on. The whole board is one click target — the
     intersection is worked out from the coordinates — so the only elements
     that ever change are the stones. */
  function goban(n) {
    let grid = '';
    for (let k = 0; k < n; k++) {
      grid += '<i class="gline v" style="left:' + pct(k, n) + '"></i>';
      grid += '<i class="gline h" style="top:' + pct(k, n) + '"></i>';
    }
    (STARS[n] || []).forEach(pt => {
      grid += '<i class="gstar" style="left:' + pct(pt[1], n) + ';top:' + pct(pt[0], n) + '"></i>';
    });
    return '<div class="goban" id="goban" style="--n:' + n + '">' +
      '<div class="ggrid" id="ggrid">' + grid +
        '<div class="gstones" id="gstones"></div><i class="glast" id="glast" hidden></i>' +
      '</div></div>';
  }

  /* A ring that spreads out from a freshly played point. */
  function ripple(layer, i, n) {
    const r = document.createElement('i');
    r.className = 'ripple';
    r.style.left = pct(i % n, n);
    r.style.top = pct((i / n) | 0, n);
    layer.appendChild(r);
    window.setTimeout(() => { if (r.parentNode) r.parentNode.removeChild(r); }, 600);
  }

  /* Reconcile the stone layer with the board: new points drop in with a ripple,
     captured ones pop off (and fly away when `fly` holds a delta for them), and
     existing elements are reused rather than rebuilt. */
  function syncStones(board, n, last, fly) {
    const layer = document.getElementById('gstones');
    if (!layer) return;
    for (let i = 0; i < board.length; i++) {
      const el = layer.querySelector('[data-i="' + i + '"]');
      const v = board[i];
      if (v) {
        if (!el) {
          const d = document.createElement('i');
          d.dataset.i = i;
          d.style.left = pct(i % n, n);
          d.style.top = pct((i / n) | 0, n);
          d.className = 'stone ' + v;
          layer.appendChild(d);
          ripple(layer, i, n);
        } else if (el.className !== 'stone ' + v) {
          el.className = 'stone ' + v;          // also revives one animating out
        }
      } else if (el && el.className.indexOf('out') < 0) {
        const away = fly && fly[i];
        if (away) {
          el.style.setProperty('--fx', away.x + 'px');
          el.style.setProperty('--fy', away.y + 'px');
          el.className = 'stone out fly';
        } else {
          el.className = 'stone out';
        }
        window.setTimeout(() => {
          if (el.parentNode && el.className.indexOf('out') >= 0) el.parentNode.removeChild(el);
        }, away ? 720 : 380);
      }
    }

    const mark = document.getElementById('glast');
    if (mark) {
      if (last == null || last < 0 || !board[last]) {
        mark.hidden = true;
      } else {
        const fresh = mark.hidden || mark.dataset.at !== String(last);
        mark.hidden = false;
        mark.dataset.at = String(last);
        mark.style.left = pct(last % n, n);
        mark.style.top = pct((last / n) | 0, n);
        mark.className = 'glast ' + (board[last] === 'b' ? 'w' : 'b');   // opposite colour
        if (fresh) {
          mark.animate([{ scale: '.25' }, { scale: '1' }],
            { duration: 280, easing: 'cubic-bezier(.2,.9,.3,1.5)' });
        }
      }
    }
  }

  /* Ring the winning run, popping the stones one after another along it. */
  function markWinLine(line) {
    const layer = document.getElementById('gstones');
    if (!layer) return;
    Array.prototype.forEach.call(layer.querySelectorAll('.win'), e => {
      e.classList.remove('win');
      e.style.animationDelay = '';
      e.style.outline = '';
    });
    (line || []).forEach((i, k) => {
      const el = layer.querySelector('[data-i="' + i + '"]');
      if (!el) return;
      el.style.animationDelay = (k * 80) + 'ms';
      el.classList.add('win');
    });
  }

  /* Flood the counted territory across the board, sweeping out from the middle,
     so the final score is something you watch happen instead of a bare number. */
  function showGoTerritory(state, done) {
    const layer = document.getElementById('gstones');
    if (!layer || !state) { done(); return; }
    const n = state.size;
    const t = Go.territory(state);
    const mid = (n - 1) / 2;
    let span = 0;
    const put = (i, cls) => {
      const c = i % n, r = (i / n) | 0;
      const d = Math.hypot(r - mid, c - mid);
      if (d > span) span = d;
      const el = document.createElement('i');
      el.className = 'terr ' + cls;
      el.style.left = pct(c, n);
      el.style.top = pct(r, n);
      el.style.animationDelay = Math.round(d * 55) + 'ms';
      layer.appendChild(el);
    };
    t.b.forEach(i => put(i, 'b'));
    t.w.forEach(i => put(i, 'w'));
    t.dame.forEach(i => put(i, 'n'));
    window.setTimeout(done, Math.round(span * 55) + 700);
  }

  /* Reconcile every square with the model. Squares opened by this action pop in
     a wave that spreads out from where the click landed. */
  function mineSync(st, fresh, origin, revealMines) {
    const grid = document.getElementById('minegrid');
    if (!grid) return;
    const isFresh = {};
    (fresh || []).forEach(i => { isFresh[i] = true; });
    const orow = origin == null ? 0 : (origin / st.cols) | 0;
    const ocol = origin == null ? 0 : origin % st.cols;

    for (let i = 0; i < st.size; i++) {
      const el = grid.children[i];
      if (!el) continue;
      let cls = 'mc', txt = '';
      if (st.open[i]) {
        cls += ' open';
        if (st.mine[i]) { cls += ' mine' + (i === st.exploded ? ' boom' : ''); txt = '●'; }
        else if (st.near[i] > 0) { cls += ' n' + st.near[i]; txt = String(st.near[i]); }
      } else if (revealMines && st.mine[i]) {
        cls += ' open mine shown';
        txt = '●';
      } else if (st.flag[i]) {
        cls += ' flag';
        txt = '⚑';
      }

      if (isFresh[i]) {
        const d = Math.abs(((i / st.cols) | 0) - orow) + Math.abs((i % st.cols) - ocol);
        el.style.animationDelay = Math.min(420, d * 24) + 'ms';
      } else if (el.style.animationDelay) {
        el.style.animationDelay = '';
      }
      if (el.className !== cls) el.className = cls;
      if (el.textContent !== txt) el.textContent = txt;
    }

    const left = document.getElementById('mineLeft');
    if (left) left.textContent = String(st.mines - st.flags);
    const face = document.getElementById('mineFace');
    if (face) face.textContent = st.status === 'won' ? '★' : (st.status === 'lost' ? '☹' : '☺');
  }

  /* Every word is drawn as a capsule: a corner is only rounded BIG when both
     cells touching it are empty, so the two ends of a word carry the four big
     corners. Where two words meet — including two ends that share one cell —
     there is a single shared flat seam instead of two colliding round ones. */
  const WS_RAD = '46%', WS_RADS = '2px';
  function wsCorners(g, cols, rows, i) {
    const r = (i / cols) | 0, c = i % cols;
    const up = r > 0 && !!g[i - cols];
    const down = r < rows - 1 && !!g[i + cols];
    const lf = c > 0 && !!g[i - 1];
    const rt = c < cols - 1 && !!g[i + 1];
    return ((!up && !lf) ? WS_RAD : WS_RADS) + ' ' +
           ((!up && !rt) ? WS_RAD : WS_RADS) + ' ' +
           ((!down && !rt) ? WS_RAD : WS_RADS) + ' ' +
           ((!down && !lf) ? WS_RAD : WS_RADS);
  }

  /* Reconcile the whole board. Cells touched by this move pop in one after
     another (`fresh` is in letter order); `preview` marks where a dragged
     tile would land. */
  function wsPaint(st, fresh, preview, ok) {
    const grid = document.getElementById('wsGrid');
    if (!grid) return;
    const g = st.grid, cols = st.cols, rows = st.rows;
    const idx = {};
    (fresh || []).forEach((i, k) => { idx[i] = k; });
    const pre = {};
    (preview || []).forEach(i => { pre[i] = true; });
    for (let i = 0; i < g.length; i++) {
      const el = grid.children[i];
      if (!el) continue;
      const cell = g[i];
      const ch = cell ? cell.ch : '';
      if (el.textContent !== ch) el.textContent = ch;
      let cls = 'ws-cell';
      if (cell) cls += ' filled o' + cell.owner + (cell.shared ? ' shared' : '');
      if (pre[i]) cls += ok ? ' pre-ok' : ' pre-bad';
      if (el.className !== cls) {
        if (idx[i] != null) el.style.animationDelay = Math.min(300, idx[i] * 55) + 'ms';
        el.className = cls;
      }
      const want = cell ? wsCorners(g, cols, rows, i) : '';
      if (el.dataset.rad !== want) {
        el.dataset.rad = want;
        if (want) el.style.setProperty('--wrad', want);
        else el.style.removeProperty('--wrad');
      }
    }
  }

  function wsPreview(st, cells, ok) { wsPaint(st, [], cells, ok); }

  function wsTrays(st, players) {
    [0, 1].forEach(pi => {
      const list = document.getElementById('wsList' + pi);
      const head = document.getElementById('wsTrayHead' + pi);
      const box = document.getElementById('wsTray' + pi);
      if (!list) return;
      const p = players[pi] || {};
      const tiles = st.tiles.filter(t => t.owner === pi && !t.placed);
      const live = st.status === 'playing';
      const mine = live && st.turn === pi;
      if (head) head.textContent = (p.name || '—') + ' · ' + tiles.length +
        (tiles.length === 1 ? ' tile' : ' tiles');
      if (box) box.classList.toggle('off', !mine);
      const pass = document.getElementById('wsPass' + pi);
      if (pass) pass.disabled = !mine;
      list.innerHTML = tiles.length
        ? tiles.map(t => wsTileHtml(t, st.turn, live)).join('')
        : '<div class="ws-empty">Tray empty</div>';
    });
    [0, 1].forEach(pi => {
      const el = document.getElementById('wsLeft' + pi);
      if (el) el.textContent = WordStack.tray(st, pi).length;

  function wsTurn(st, players) {
    const nameEl = document.getElementById('wsTurnName');
    const name = (players[st.turn] || {}).name || '—';
    if (nameEl && nameEl.textContent !== name) {

  function wordstackResult(st, res, players) {

  /* ---------------- tacta ---------------- */

  /* One printed shape. It fills its block exactly and is drawn as a thin
     outline over a dark fill, which is also exactly the cells the engine
     counts as "printed" — so what you see is what covers a dot. */
  function tactaShape(b, cls) {
    const c = 'tc-shape' + (cls ? ' ' + cls : '');
    if (b.k === 'T') {
      const pts = Tacta.triVerts(b);
      return '<polygon class="' + c + '" points="' +
        pts.map(p => p[0].toFixed(3) + ',' + p[1].toFixed(3)).join(' ') + '"/>';
    }
    return '<rect class="' + c + '" x="' + b.c + '" y="' + b.r + '" width="' + b.w +
      '" height="' + b.h + '" rx="0.09"/>';
  }

  /* A white ring with a pip in it, like the dots printed on the real cards. */
  function tactaDot(cx, cy) {
    return '<circle class="tc-dot" cx="' + cx + '" cy="' + cy + '" r="0.19"/>' +
      '<circle class="tc-dotp" cx="' + cx + '" cy="' + cy + '" r="0.07"/>';
  }

  /* The card's suit badge, sitting in the middle with its number inside. */
  function tactaBadge(kind, x, y) {
    if (kind === 'T') {
      return '<polygon class="tc-badge" points="' + x + ',' + (y - 0.5) + ' ' +
        (x + 0.54) + ',' + (y + 0.42) + ' ' + (x - 0.54) + ',' + (y + 0.42) + '"/>';
    }
    if (kind === 'A') {
      return '<rect class="tc-badge" x="' + (x - 0.3) + '" y="' + (y - 0.48) +
        '" width="0.6" height="0.96" rx="0.14"/>';
    }
    if (kind === 'B') {
      return '<rect class="tc-badge" x="' + (x - 0.48) + '" y="' + (y - 0.3) +
        '" width="0.96" height="0.6" rx="0.14"/>';
    }
    return '<rect class="tc-badge" x="' + (x - 0.42) + '" y="' + (y - 0.42) +
      '" width="0.84" height="0.84" rx="0.16"/>';
  }

  /* One whole card: plate, frame, shapes, dots and the middle badge. */
  function tactaCardInner(card, ow, oh, extra) {
    const blocks = Tacta.blocksOf(card);
    const dots = Tacta.dotsOf(card);
    const cw = Tacta.W, ch = Tacta.H;
    let out = '<rect class="tc-plate" x="0" y="0" width="' + cw + '" height="' + ch + '" rx="0.38"/>';
    blocks.forEach(b => { out += tactaShape(b); });
    dots.forEach(di => {
      const cx = ((di % ow) | 0) + 0.5, cy = (((di / ow) | 0) + 0.5);
      out += tactaDot(cx, cy);
    });
    out += tactaBadge(blocks.length ? blocks[0].k : 'S', cw / 2, ch / 2) +
      '<text class="tc-num" x="' + (cw / 2) + '" y="' + (ch / 2) + '">' + card.num + '</text>' +
      '<rect class="tc-frame" x="0" y="0" width="' + cw + '" height="' + ch + '" rx="0.38"/>';
    return '<g class="tc-gcard o' + card.owner + (extra ? ' ' + extra : '') + '">' + out + '</g>';
  }

  /* A standalone svg of one card — the tray and the drag ghost use this. */
  function tactaCardSvg(card, cls) {
    const ow = Tacta.orW(card.rot), oh = Tacta.orH(card.rot);
    const pad = 0.1;
    return '<svg class="tc-cardsvg" viewBox="' + (-pad) + ' ' + (-pad) + ' ' +
      (ow + pad * 2) + ' ' + (oh + pad * 2) + '">' +
      tactaCardInner(card, ow, oh, cls || '') + '</svg>';
  }

  /* The base card: every shape in every position the set uses, so any card
     can line up with it. */
  function tactaStartInner() {
    const cw = Tacta.W, ch = Tacta.H;
    let out = '<rect class="tc-plate tc-platestart" x="0" y="0" width="' + cw +
      '" height="' + ch + '" rx="0.38"/>';
    Tacta.BASE_POSITIONS.forEach(b => { out += tactaShape(b, 'tc-guide'); });
    out += '<rect class="tc-startmark" x="' + (cw / 2 - 0.62) + '" y="' + (ch / 2 - 0.62) +
      '" width="1.24" height="1.24" rx="0.22"/>';
    return out;
  }

  /* The whole pile, painted bottom to top, so a card laid later covers
     whatever it lands on. */
  function tactaArt(st) {
    let out = '<g transform="translate(' + st.startC + ',' + st.startR + ')">' + tactaStartInner() + '</g>';
    const lastIdx = st.stack.length - 1;
    st.stack.forEach((id, k) => {
      const card = Tacta.cardOf(st, id);
      out += '<g transform="translate(' + card.c + ',' + card.r + ')">' +
        tactaCardInner(card, Tacta.orW(card.rot), Tacta.orH(card.rot),
          k === lastIdx ? 'last' : '') + '</g>';
    });
    return out;
  }

  function tactaSide(st, players, pi) {
    const p = players[pi] || {};
    const t = Tacta.tally(st);
    const cap = Tacta.TOTAL_DOTS;
    const pct = Math.round(100 * t.visible[pi] / cap);
    return '<div class="tc-side p' + pi + '" id="tcSide' + pi + '">' +
      '<div class="player-avatar">' + avatarSvg(p.avatar) + '</div>' +
      '<div class="tc-side-info">' +
        '<div class="tc-side-name">' + esc(p.name || '—') + '</div>' +
        '<div class="tc-dots"><b id="tcDots' + pi + '">' + t.visible[pi] + '</b>' +
          '<span>/' + cap + ' dots</span></div>' +
      '</div>' +
      '<div class="tc-dotbar p' + pi + '"><i id="tcFill' + pi + '" style="width:' + pct + '%"></i></div>' +
      '</div>';
  }

  function tactaTray(pi, players) {
    const p = players[pi] || {};
    return '<div class="tc-tray p' + pi + '" id="tcTray' + pi + '">' +

  /* Repaints the pile. Cheap: at most ~15 cards. */
  function tactaPaint(st) {
    const art = document.getElementById('tcArt');
    if (!art) return;
    art.innerHTML = tactaArt(st);
  }

  function tactaTrays(st, players) {
    [0, 1].forEach(pi => {
      const list = document.getElementById('tcList' + pi);
      const head = document.getElementById('tcTrayHead' + pi);
      const box = document.getElementById('tcTray' + pi);
      if (!list) return;
      const p = players[pi] || {};
      const ids = Tacta.handOf(st, pi);
      const live = st.status === 'playing';
      const mine = live && st.turn === pi;
      if (head) {
        head.textContent = (p.name || '—') + ' · ' + ids.length +
          (ids.length === 1 ? ' card' : ' cards');
      }
      if (box) box.classList.toggle('off', !mine);
      list.innerHTML = ids.length
        ? ids.map(id => {
            const card = Tacta.cardOf(st, id);
            return '<button class="tc-card' + (mine ? '' : ' dim') + '" data-card="' + id + '">' +
              tactaCardSvg(card) + '</button>';
          }).join('')
        : '<div class="tc-empty">Every card is down</div>';
    });
  }

  function tactaTurn(st, players) {
    const p = players[st.turn] || {};
    const me = players[0] || {}, you = players[1] || {};
    const t = Tacta.tally(st);
    const cap = Tacta.TOTAL_DOTS;
    const nameEl = document.getElementById('tcTurn');
    if (nameEl) nameEl.textContent = (p.name || '—') + ' to play';
    [0, 1].forEach(pi => {
      const el = document.getElementById('tcSide' + pi);
      if (el) el.classList.toggle('on', st.status === 'playing' && st.turn === pi);
      const num = document.getElementById('tcDots' + pi);
      if (num) num.textContent = t.visible[pi];
      const fill = document.getElementById('tcFill' + pi);
      if (fill) fill.style.width = Math.round(100 * t.visible[pi] / cap) + '%';
    });
    const sub = document.getElementById('tcSub');
    if (sub) {
      sub.textContent = st.status === 'playing'
        ? 'Cards left — ' + esc(me.name || 'P1') + ' ' + Tacta.handOf(st, 0).length +
          ' · ' + esc(you.name || 'P2') + ' ' + Tacta.handOf(st, 1).length
        : '';
    }
  }

  function tactaResult(st, res, players) {
    const sidesHtml = [0, 1].map(pi => {
      const s = res.scores[pi];
      const key = 'dots · ' + res.perDot + ' pts each' + (s.bonus ? ' +' + s.bonus + ' win' : '');
      return duelSide(players, [0, 1], pi, pi === 0 ? 'b' : 'w',
        { v: s.visible, win: res.winner === pi }, key, s.points, true,

    }).join('<div class="duel-vs">vs</div>');
    const headline = res.status === 'draw'
      ? (res.reason === 'stuck'
        ? 'A draw — neither tray could add another card'

      : esc((players[res.winner] || {}).name || '—') +
        (res.reason === 'stuck' ? ' wins on dots in sight' : ' kept the most dots in sight');
    boardResultScreen(headline, sidesHtml, [
      { v: res.moves, k: 'Cards played' },
      { v: res.covered, k: 'Dots covered' },
      { v: fmtTime(res.seconds), k: 'Time' }
    ], 'Rematch');
  }

  /* Tiles are absolutely positioned and moved with a transform, so a slide is a
     plain CSS transition rather than a re-layout. */
  function buildSlideTiles(st) {
    const grid = document.getElementById('slideGrid');
    if (!grid) return;
    let html = '';
    for (let i = 0; i < st.size; i++) {
      if (st.board[i] === Slide.BLANK) continue;
      html += '<button class="slide-tile" data-at="' + i + '" data-v="' + st.board[i] + '">' +
        '<span>' + st.board[i] + '</span></button>';
    }
    grid.innerHTML = html;
    slideSync(st, null);
  }

  /* Re-seat every tile from the model. Nothing is rebuilt, so the tiles that did
     not move simply stay put and the one that did glides across. */
  function slideSync(st, res) {
    const grid = document.getElementById('slideGrid');
    if (!grid) return;
    const n = st.n;
    const tiles = {};
    Array.prototype.forEach.call(grid.children, el => { tiles[el.dataset.v] = el; });
    for (let i = 0; i < st.size; i++) {
      const v = st.board[i];
      if (v === Slide.BLANK) continue;
      const el = tiles[v];
      if (!el) continue;
      el.style.setProperty('--cx', (i % n));
      el.style.setProperty('--cy', ((i / n) | 0));
      const home = (i === v - 1);
      el.classList.toggle('home', home);
      el.classList.toggle('can', Slide.canSlide(st, i));
      el.dataset.at = i;
    }
    const mv = document.getElementById('moveCount');
    if (mv) mv.textContent = String(st.moves);
    if (res && res.moved && res.solved) {
      const s = document.getElementById('slideStatus');
      if (s) s.textContent = 'Solved in ' + st.moves + ' moves!';
    }
  }

  function sudokuDifficulty(selected) {
    puzzleDiff('Sudoku',
      'Fill the grid so every row, every column and every 3 × 3 box holds the ' +
      'numbers 1 to 9 exactly once. Every puzzle is checked to have a single ' +
      'solution, so there is only ever one way to finish it.',
      Sudoku.LEVELS, selected, 'data-sulevel',
      lv => 'about ' + (lv.clues - 1) + ' numbers given · par ' + fmtTime(lv.par));
  }

  function suCellClass(st, i, bad) {
    let cls = 'su-c';
    if (st.given[i]) cls += ' given';
    else if (st.grid[i]) cls += ' entry';
    const r = (i / 9) | 0, c = i % 9;
    if (c % 3 === 2 && c < 8) cls += ' br';
    if (r % 3 === 2 && r < 8) cls += ' bb';
    if (bad[i]) cls += ' bad';
    return cls;
  }

  function sudokuGame(st) {
    const cells = [];
    for (let i = 0; i < st.size; i++) {
      cells.push('<button class="' + suCellClass(st, i, new Array(st.size).fill(false)) +
        '" data-i="' + i + '"></button>');
    }
    let pad = '';
    for (let v = 1; v <= 9; v++) pad += '<button class="su-key" data-v="' + v + '">' + v + '</button>';
    pad += '<button class="su-key erase" data-v="0" title="Erase (Backspace)">⌫</button>';

    app().innerHTML =
      '<div class="screen su-screen">' +
        '<div class="mine-head">' +
          '<div class="mine-stat"><b id="suLeft">' + (st.size - st.clues) + '</b><span>to fill</span></div>' +
          '<button class="mine-face" id="suNew" title="New puzzle" aria-label="New puzzle">↻</button>' +
          '<div class="mine-stat"><b id="timer">0:00</b><span>time</span></div>' +
        '</div>' +
        '<div class="su-wrap">' +
          '<div class="su-grid" id="suGrid">' + cells.join('') + '</div>' +
          '<div class="su-side">' +
            '<div class="su-pad" id="suPad">' + pad + '</div>' +
            '<button class="btn ghost su-notes" id="suNotes">Pencil marks: off</button>' +
            '<div class="chess-status" id="suStatus">Tap a square, then a number. ' +
              'Keys 1-9 write, Backspace clears, arrows move, N toggles pencil marks.</div>' +
          '</div>' +
        '</div>' +
        '<div class="mine-foot">' +
          '<span class="mine-level">' + esc(st.label) + ' · ' + st.clues + ' numbers given · par ' +
            fmtTime(st.par) + '</span>' +
          HOME_BTN +
        '</div>' +
      '</div>';
  }

  /* Repaint the board from the model, plus the light highlighting that makes a
     9 × 9 grid readable: the selected square, its row/column/box, and every
     square holding the same number. */
  function sudokuSync(st) {
    const grid = document.getElementById('suGrid');
    if (!grid) return;
    const bad = Sudoku.conflicts(st);
    const sel = st.sel;
    const selRow = sel >= 0 ? (sel / 9) | 0 : -1;
    const selCol = sel >= 0 ? sel % 9 : -1;
    const selBox = sel >= 0 ? (((sel / 9) | 0) / 3 | 0) * 3 + (((sel % 9) / 3) | 0) : -1;
    const selVal = sel >= 0 ? st.grid[sel] : 0;

    for (let i = 0; i < st.size; i++) {
      const el = grid.children[i];
      if (!el) continue;
      const v = st.grid[i];
      const r = (i / 9) | 0, c = i % 9;
      const box = (r / 3 | 0) * 3 + ((c / 3) | 0);
      let cls = suCellClass(st, i, bad);
      if (sel >= 0 && i !== sel && (r === selRow || c === selCol || box === selBox)) cls += ' peer';
      if (selVal && v === selVal && i !== sel) cls += ' same';
      if (st.wrong[i] && !v) cls += ' was-wrong';
      if (i === sel) cls += ' sel';
      if (el.className !== cls) el.className = cls;

      const notes = st.notes[i];
      let html = '';
      if (v) html = String(v);
      else if (notes) {
        html = '<span class="su-notes-grid">';
        for (let d = 1; d <= 9; d++) {
          html += '<i>' + ((notes >> (d - 1)) & 1 ? d : '') + '</i>';
        }
        html += '</span>';
      }
      if (el.innerHTML !== html) el.innerHTML = html;
    }

    const left = document.getElementById('suLeft');
    if (left) left.textContent = String(st.size - Sudoku.filled(st));

    const pad = document.getElementById('suPad');
    if (pad) {
      Array.prototype.forEach.call(pad.children, btn => {
        const v = Number(btn.dataset.v);
        btn.classList.toggle('done', v > 0 && Sudoku.placed(st, v) >= 9);
      });
    }
    const nb = document.getElementById('suNotes');
    if (nb) {
      nb.textContent = 'Pencil marks: ' + (st.notesOn ? 'on' : 'off');
      nb.classList.toggle('active', st.notesOn);
    }
  }

  <script>
/* ============================================================

  let chessBusy = false;

  let gomokuState = null;
  let goState = null;
  let boardSides = ['b', 'w'];
  let boardBusy = false;
  const boardSize = { gomoku: 15, go: 9 };

  let mineState = null;
  let mineLevel = 'beginner';
  let slideState = null;
  let slideLevel = 'easy';
  let suState = null;
  let suLevel = 'easy';
  let flagMode = false;

  let wordstackState = null;
  let wsLevel = 'easy';
  let wsDrag = null;           // in-flight drag of a tray tile
  let wsZoom = 1;              // board scale, driven by pinch / wheel / buttons
  let wsZoomTween = null;      // in-flight animated zoom
  let wsBase = null;           // natural (unscaled) board size in px
  let wsPan = null;            // one-finger / mouse panning of the board
  let wsPinch = null;          // two-finger zooming of the board
  const wsPointers = new Map();
  let wsTickId = null;         // per-turn countdown frame
  let wsPassTimer = null;      // pending automatic pass
  let wsEndsAt = 0;
  let wsSayId = null;
  let wsSayUntil = 0;
  const WS_ZOOM_MIN = 0.4, WS_ZOOM_MAX = 4;

  let tactaState = null;
  let tcSel = -1;              // hand card currently highlighted
  let tcDrag = null;           // in-flight drag of a hand card
  let tcPreview = [];          // board cells carrying preview classes right now
  let tcPassTimer = null;
  let tcSayId = null;
  let tcSayUntil = 0;
  let tcZoom = 1;              // table scale, driven by pinch / wheel / buttons
  let tcZoomTween = null;      // in-flight animated zoom
  let tcBase = null;           // natural (unscaled) table size in px
  let tcPan = null;            // one-finger panning of the table
  let tcPinch = null;          // two-finger zooming of the table
  const tcPointers = new Map();
  const TC_ZOOM_MIN = 0.35, TC_ZOOM_MAX = 5;
  const TC_LEAVE_MS = 260;

  /* choreography, in ms (all collapse to 0 under reduced motion) */
  const CRACK_MS = 220, SHARD_MS = 240, SLIDE_MS = 280, BUSY_MS = 400;
  const KING_CRACK_MS = 620, KING_SHARD_MS = 320, LEAVE_MS = 260;
  const anim = ms => (reduceMotion ? 0 : ms);

  let timerId = null;
  let paused = false;
  let startedAt = 0;
  let accumulated = 0;
  let mindEl = null;
  let armed = false;      // Super Mind armed, waiting for a gap click

  /* ---------------- boot ---------------- */
  function init() {
    const st = Store.init();
    document.documentElement.setAttribute('data-theme', st.theme || 'light');

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('fullscreenToggle').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', syncFullscreenButton);
    window.addEventListener('resize', wsOnResize);
    document.getElementById('logoHome').addEventListener('click', e => {
      e.preventDefault();
      leaveGame();
      showHome();
    });
    document.addEventListener('click', onDocumentClick);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') setArmed(false);
      const typing = e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName || '');
      if (!typing && tactaState && tactaState.status === 'playing') {
        if (e.key === 'r' || e.key === 'R') { e.preventDefault(); tcTurnSel(); return; }
        if (e.key === 'm' || e.key === 'M') { e.preventDefault(); tcMirrorSel(); return; }
      }
      if (!typing && slideState && slideState.status === 'playing') {
        if (e.key === 'ArrowUp') { e.preventDefault(); slideStep(-1, 0); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); slideStep(1, 0); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); slideStep(0, -1); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); slideStep(0, 1); return; }
      }
      if (!typing && suState && suState.status === 'playing') {
        if (e.key >= '1' && e.key <= '9') { e.preventDefault(); writeSudoku(Number(e.key)); return; }
        if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
          e.preventDefault(); writeSudoku(0); return;
        }
        if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          Sudoku.toggleNotes(suState);
          UI.sudokuSync(suState);
          return;
        }
        if (e.key === 'ArrowUp') { e.preventDefault(); sudokuMove(-1, 0); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); sudokuMove(1, 0); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); sudokuMove(0, -1); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); sudokuMove(0, 1); return; }
      }
      if (!typing && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        toggleFullscreen();
      }
    });
    syncFullscreenButton();

    showHome();
  }

  /* ---------------- fullscreen ---------------- */
  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  }

  function syncFullscreenButton() {
    const btn = document.getElementById('fullscreenToggle');
    if (!btn) return;
    const on = !!document.fullscreenElement;
    btn.classList.toggle('active', on);
    btn.title = on ? 'Exit fullscreen (F)' : 'Fullscreen (F)';
    btn.setAttribute('aria-label', btn.title);
  }

  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    Store.setTheme(next);
    const btn = document.getElementById('themeToggle');
    if (btn && !reduceMotion) {
      btn.classList.remove('spin');
      void btn.offsetWidth;
      btn.classList.add('spin');
    }
  }

  /* ---------------- screens ---------------- */
  /* Keep the home selection valid against the current player list. */
  let seeded = false;
  function pruneSelection() {
    const ids = Store.state.players.map(p => p.id);
    selected = selected.filter(id => ids.indexOf(id) >= 0);
    const max = isDuel(mode) ? 2 : 1;
    if (selected.length > max) selected = selected.slice(0, max);
    // seed from the remembered player once per session, so the user can still
    // clear the selection on purpose afterwards
    if (!seeded) {
      seeded = true;
      if (!selected.length && ids.indexOf(Store.state.currentPlayerId) >= 0) {
        selected = [Store.state.currentPlayerId];
      }
    }
    if (selected.length) Store.selectPlayer(selected[0]);
  }

  function showHome() {
    mathState = null;
    chessState = null;
    gomokuState = null;
    goState = null;
    mineState = null;
    slideState = null;
    suState = null;
    wordstackState = null;
    tactaState = null;
    tcSel = -1;
    clearMathTimers();
    clearWsTimers();
    clearTcTimers();
    stopTimer();
    hideMind();
    setArmed(false);
    const st = Store.state;
    pruneSelection();
    UI.home(st.players, selected, mode);

    document.getElementById('addPlayer').addEventListener('click', () => {
      UI.addPlayerModal((name, avatar) => {
        const p = Store.addPlayer(name, avatar);
        selected = (isDuel(mode) && selected.length >= 2)
          ? [selected[1], p.id]
          : selected.concat([p.id]);
        showHome();
      });
    });

    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.mode === mode) return;
        mode = btn.dataset.mode;
        selected = selected.slice(0, isDuel(mode) ? 2 : 1);
        refreshHome();
      });
    });

    document.querySelectorAll('.player-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.player;
        if (isDuel(mode)) {
          const at = selected.indexOf(id);
          if (at >= 0) selected.splice(at, 1);            // tap again to unpick
          else if (selected.length < 2) selected.push(id);
          else { selected.shift(); selected.push(id); }    // replace the oldest pick
        } else {
          selected = [id];
        }
        refreshHome();
      });
    });

    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const p = Store.getPlayer(btn.dataset.del);
        if (!p) return;
        if (confirm('Remove player "' + p.name + '" and their scores?')) {
          Store.deletePlayer(p.id);
          selected = selected.filter(id => id !== p.id);
          showHome();
        }
      });
    });

    document.querySelectorAll('[data-history]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const p = Store.getPlayer(btn.dataset.history);
        if (p) UI.historyModal(p);
      });
    });

    const cont = document.getElementById('continueBtn');
    if (cont) cont.addEventListener('click', () => {
      if (mode === 'math') {
        if (selected.length === 2) showMathDifficulty();

        if (selected.length === 2) startChess();
      } else if (mode === 'gomoku' || mode === 'go') {
        if (selected.length === 2) showBoardSetup(mode);
      } else if (mode === 'wordstack') {
        if (selected.length === 2) showWordStackSetup();
      } else if (mode === 'tacta') {
        if (selected.length === 2) startTacta();
      } else if (mode === 'mine') {
        if (selected.length === 1) showMineDifficulty();
      } else if (mode === 'slide') {
        if (selected.length === 1) showSlideDifficulty();
      } else if (mode === 'sudoku') {
        if (selected.length === 1) showSudokuDifficulty();
      } else if (selected.length === 1) {

      }
    });
  }

  /* Picking a player or a mode only flips the selection — rebuilding the whole

  function refreshHome() {
    pruneSelection();
    UI.homeUpdate(Store.state.players, selected, mode);
  }

  /* Any in-game Home button: leave the game and go back. Scores are only ever

  function bindHome() {

  function showDifficulty() {

  }

  /* ---------------- timer & pause ---------------- */
  function elapsedMs() { return paused ? accumulated : accumulated + (Date.now() - startedAt); }
  function tickTimer() {
    const el = document.getElementById('timer');

  }
  function startTimer() {

  function pauseGame() {
    if (paused || !round) return;

    setArmed(false);

    if (!paused) return;

  function refreshProgress() {
    if (!round) return;

    inputs.forEach(i => { if (i.value.trim()) filled++; });

        const cleaned = inp.value.replace(/[^A-Za-z]/g, '');

          prev.focus();
          prev.setSelectionRange(prev.value.length, prev.value.length);
